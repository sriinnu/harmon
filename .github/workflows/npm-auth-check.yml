name: npm auth check

# On-demand proof that NPM_TOKEN can publish @sriinnu/harmon.
#
# Read APIs cannot prove write rights: granular tokens 403 on the org
# listing endpoint regardless of their package grants, and npm masks
# permission failures as 404 only at publish time. The only honest probe is
# a real publish — so this publishes a canary version under a throwaway
# dist-tag and immediately unpublishes it.
on:
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  check:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: whoami (authentication)
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: canary publish + unpublish (authorization)
        run: |
          export CANARY="0.0.0-authcheck.${GITHUB_RUN_ID}"
          # npm version chokes on pnpm's workspace:* protocol — write directly.
          node -e "const fs=require('fs');const f='apps/harmon-cli/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.CANARY;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          pnpm --filter @sriinnu/harmon publish --no-git-checks --access public --tag authcheck --ignore-scripts
          echo "Publish rights CONFIRMED (published $CANARY)"
          # npm cleanup commands run outside the workspace so npm never
          # parses workspace:* manifests.
          cd "$RUNNER_TEMP"
          npm unpublish "@sriinnu/harmon@$CANARY" --force
          npm dist-tag rm @sriinnu/harmon authcheck || true
          echo "Canary cleaned up — registry back to pristine"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
